name: Release Agent OS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release candidate
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          [[ -f "$notes_file" ]]
          grep -Fxq "## ✨ Features" "$notes_file"
          grep -Fxq "## 🐛 Fixes" "$notes_file"
          release_home="${RUNNER_TEMP}/agent-os-home"
          ./bin/agent-os init --source "$GITHUB_WORKSPACE" --home "$release_home" --apply
          ./bin/agent-os validate --source "$GITHUB_WORKSPACE" --home "$release_home"
          ./bin/agent-os audit-publication --source "$GITHUB_WORKSPACE"
          swift test --package-path apps/agent-os

      - name: Package signed update
        env:
          AGENT_OS_SPARKLE_PRIVATE_KEY: ${{ secrets.AGENT_OS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "$AGENT_OS_SPARKLE_PRIVATE_KEY" ]]
          key_file="$(mktemp "${RUNNER_TEMP}/agent-os-sparkle-key.XXXXXX")"
          [[ -n "$key_file" && "$key_file" == "${RUNNER_TEMP}/agent-os-sparkle-key."* ]]
          cleanup() {
            if [[ -n "${key_file:-}" && "$key_file" == "${RUNNER_TEMP}/agent-os-sparkle-key."* && -f "$key_file" && ! -L "$key_file" ]]; then
              /bin/rm -f -- "$key_file"
            fi
          }
          trap cleanup EXIT
          chmod 600 "$key_file"
          printf '%s' "$AGENT_OS_SPARKLE_PRIVATE_KEY" > "$key_file"
          apps/agent-os/script/package_release.sh --version "$version" --ed-key-file "$key_file"
          app_binary="apps/agent-os/dist/release/Agent OS.app/Contents/MacOS/AgentOS"
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(lipo -archs "$app_binary")" == "arm64" ]]

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_body="$(mktemp "${RUNNER_TEMP}/agent-os-release-notes.XXXXXX")"
          [[ -n "$release_body" && "$release_body" == "${RUNNER_TEMP}/agent-os-release-notes."* ]]
          cleanup() {
            if [[ -n "${release_body:-}" && "$release_body" == "${RUNNER_TEMP}/agent-os-release-notes."* && -f "$release_body" && ! -L "$release_body" ]]; then
              /bin/rm -f -- "$release_body"
            fi
          }
          trap cleanup EXIT
          {
            cat "$notes_file"
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
          } > "$release_body"
          gh release create "$GITHUB_REF_NAME" \
            "apps/agent-os/dist/release/AgentOS-${version}-macOS.zip" \
            "apps/agent-os/dist/release/AgentOS-${version}-macOS.zip.sha256" \
            "apps/agent-os/dist/release/appcast.xml" \
            --verify-tag \
            --notes-file "$release_body" \
            --title "Agent OS ${version}"
