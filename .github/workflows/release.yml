name: Release Agent OS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release candidate
        run: |
          ruby test/run.rb
          node test/plugin_packages_test.mjs
          swift test --package-path apps/agent-os

      - name: Package signed update
        env:
          AGENT_OS_SPARKLE_PRIVATE_KEY: ${{ secrets.AGENT_OS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "$AGENT_OS_SPARKLE_PRIVATE_KEY" ]]
          key_file="$(mktemp "${RUNNER_TEMP}/agent-os-sparkle-key.XXXXXX")"
          [[ -n "$key_file" && "$key_file" == "${RUNNER_TEMP}/agent-os-sparkle-key."* ]]
          cleanup() {
            if [[ -n "${key_file:-}" && "$key_file" == "${RUNNER_TEMP}/agent-os-sparkle-key."* && -f "$key_file" && ! -L "$key_file" ]]; then
              /bin/rm -f -- "$key_file"
            fi
          }
          trap cleanup EXIT
          chmod 600 "$key_file"
          printf '%s' "$AGENT_OS_SPARKLE_PRIVATE_KEY" > "$key_file"
          apps/agent-os/script/package_release.sh --version "$version" --ed-key-file "$key_file"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "apps/agent-os/dist/release/AgentOS-${version}-macOS.zip" \
            "apps/agent-os/dist/release/AgentOS-${version}-macOS.zip.sha256" \
            "apps/agent-os/dist/release/appcast.xml" \
            --verify-tag \
            --generate-notes \
            --title "Agent OS ${version}"
